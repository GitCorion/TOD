name: tod

services:
  tod:
    build: .
    container_name: tod
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Etc/UTC}
      TOD_DB: /config/tod.db
      TOD_CATALOG_LIBRARY: /media/catalogo
      TOD_LIBRARY_ROOT: /library
      TOD_DOWNLOADS_ROOT: /downloads
      TOD_ONDEMAND_SAVE: /downloads/ondemand
      TOD_SEED_ROOT: /downloads/catalogo
      TOD_STRM_ROOTS: /media/catalogo
      TOD_PLAYBACK_BASE_URL: http://tod:8773
      TOD_WEB_ALLOWED_HOSTS: ${TOD_WEB_ALLOWED_HOSTS:-localhost,127.0.0.1}
      TOD_WEB_TOKEN: ${TOD_WEB_TOKEN:-}
      QBIT_URL: http://qbittorrent:8080
      QBIT_USER: ${QBIT_USER:-admin}
      QBIT_PASS: ${QBIT_PASS:-}
      PROWLARR_URL: http://prowlarr:9696/api/v1
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:-}
      JACKETT_URL: http://jackett:9117/api/v2.0
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JELLYFIN_URL: http://jellyfin:8096
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "8773:8773"
    volumes:
      - ./data/tod:/config
      - ./data/media:/media
      - ./data/downloads:/downloads
      - ./data/library:/library
    depends_on:
      - qbittorrent
      - prowlarr
      - jackett
      - jellyfin

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: tod-qbittorrent
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: 8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./data/qbittorrent:/config
      - ./data/downloads:/downloads

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: tod-jellyfin
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "8096:8096"
    volumes:
      - ./data/jellyfin:/config
      - ./data/media:/media

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: tod-prowlarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "9696:9696"
    volumes:
      - ./data/prowlarr:/config

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: tod-jackett
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "9117:9117"
    volumes:
      - ./data/jackett:/config
