<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1114">
  <title>TOD</title>
  <link rel="icon" href="/static/tod-mark.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/tod-mark.png">
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Saltar al contenido</a>

  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9"/><path d="m7 13 5-5 5 5"/><path d="M4 3h16"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="2.5"/></symbol>
    <symbol id="i-seed" viewBox="0 0 24 24"><path d="M12 21V9"/><path d="M12 9C12 5 9 3 5 3c0 4 3 6 7 6Z"/><path d="M12 13c0-3 2.5-5 6-5 0 3-2.5 5-6 5Z"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01"/></symbol>
    <symbol id="i-wrench" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2.8-2.8 2.3-2.3Z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L19 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 9v5M12 17.5h.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01M16 17h.01"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M20 14v6H4V4h6"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8L3 5Z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></symbol>
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark" aria-hidden="true">
          <img src="/static/tod-mark.svg" alt="">
        </span>
        <span class="brand-text"><strong>TOD</strong><small>Torrent on Demand</small></span>
      </a>

      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Inicio</span></a>
        <a href="#/catalog" data-route="catalog"><svg class="icon"><use href="#i-grid"/></svg><span>Biblioteca</span></a>
        <a href="#/add" data-route="add"><svg class="icon"><use href="#i-plus"/></svg><span>Añadir</span></a>
        <a href="#/downloads" data-route="downloads"><svg class="icon"><use href="#i-download"/></svg><span>Actividad</span><em class="nav-count" id="navJobs"></em></a>
        <a href="#/system" data-route="system"><svg class="icon"><use href="#i-server"/></svg><span>Sistema</span><em class="nav-count attention hidden" id="navAttention" aria-live="polite"></em></a>
      </nav>

      <div class="sidebar-foot">
        <button class="btn btn-ghost btn-sm" data-action="shortcuts" aria-label="Ver atajos de teclado">Atajos <kbd>?</kbd></button>
        <button class="btn btn-ghost btn-sm hidden" id="logoutBtn" data-action="logout">Salir</button>
      </div>
    </aside>

    <div class="scrim" id="scrim" data-action="menu-close"></div>

    <main class="main" id="main">
      <header class="topbar">
        <button class="btn btn-icon only-mobile" data-action="menu" aria-label="Abrir menú">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <div class="page-head">
          <h1 id="pageTitle" tabindex="-1">Inicio</h1>
        </div>
        <button class="search-trigger" id="searchTrigger" data-action="palette-open" aria-label="Buscar en la biblioteca (Ctrl K)">
          <svg class="icon"><use href="#i-search"/></svg>
          <span>Buscar en la biblioteca…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <a class="btn btn-primary top-add" href="#/add"><svg class="icon"><use href="#i-plus"/></svg> Añadir</a>
        <div class="top-actions">
          <button class="btn btn-icon" id="themeToggle" data-action="theme" aria-label="Cambiar a tema claro" title="Cambiar tema">
            <svg class="icon" id="themeIcon"><use href="#i-sun"/></svg>
          </button>
          <span class="conn" id="liveDot" title="servidor" aria-label="estado del servidor"></span>
        </div>
      </header>
      <div class="section-tabs hidden" id="sectionTabs" role="navigation" aria-label="Sección"></div>
      <div class="activity-bar hidden" id="activityBar"></div>
      <section id="view" class="view"></section>
    </main>

    <nav class="mobile-nav" id="mobileNav" aria-label="Navegación rápida">
      <a href="#/dashboard" data-route="dashboard"><svg class="icon"><use href="#i-home"/></svg><span>Inicio</span></a>
      <a href="#/catalog" data-route="catalog"><svg class="icon"><use href="#i-grid"/></svg><span>Biblioteca</span></a>
      <a href="#/add" data-route="add"><svg class="icon"><use href="#i-plus"/></svg><span>Añadir</span></a>
      <a href="#/downloads" data-route="downloads"><svg class="icon"><use href="#i-download"/></svg><span>Actividad</span></a>
      <button data-action="menu"><svg class="icon"><use href="#i-menu"/></svg><span>Más</span></button>
    </nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="selectionBar" class="selection-bar hidden" aria-live="polite"></div>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" role="document">
      <header class="modal-head">
        <h2 id="modalTitle">Detalle</h2>
        <button class="btn btn-icon" data-action="modal-close" aria-label="Cerrar">
          <svg class="icon"><use href="#i-close"/></svg>
        </button>
      </header>
      <div id="modalBody" class="modal-body"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </div>
  </div>

  <div id="palette" class="palette hidden" role="dialog" aria-modal="true" aria-label="Buscar en la biblioteca">
    <div class="palette-card">
      <form class="palette-search" id="paletteForm" autocomplete="off">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="paletteInput" name="q" placeholder="Buscar en la biblioteca o ir a…" aria-label="Buscar en la biblioteca o ir a una página" autocomplete="off">
        <kbd>Esc</kbd>
      </form>
      <div id="paletteResults" class="palette-results"></div>
      <footer class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> moverse</span>
        <span><kbd>Enter</kbd> abrir</span>
        <a href="#/add" data-action="palette-add">Añadir</a>
      </footer>
    </div>
  </div>

  <div id="login" class="login hidden">
    <form class="login-card" id="loginForm">
      <span class="brand-mark big" aria-hidden="true">
        <img src="/static/tod-mark.svg" alt="">
      </span>
      <h2>TOD</h2>
      <p>Torrent on Demand. Introduce el token de acceso para abrir la consola.</p>
      <label class="field">
        <span>Token</span>
        <input type="password" id="loginToken" autocomplete="current-password" autofocus>
      </label>
      <button class="btn btn-primary" type="submit">Entrar</button>
      <p class="error tiny" id="loginError"></p>
    </form>
  </div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
