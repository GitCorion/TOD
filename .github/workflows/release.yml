name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar (ej. v0.2.6)"
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobar versión
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PKG" != "$VERSION" ]; then
            echo "::error::pyproject.toml=$PKG, tag=$VERSION"
            exit 1
          fi

      - name: Construir wheel y sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Versión
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/gitcorion/tod:${{ env.VERSION }}
            ghcr.io/gitcorion/tod:latest
          labels: |
            org.opencontainers.image.title=TOD
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.source=https://github.com/GitCorion/TOD
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Versión
        run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Preparar assets
        run: |
          sed "s|build: \\.|image: ghcr.io/gitcorion/tod:${VERSION}|" \
            docker-compose.yml > docker-compose.release.yml
          cp .env.docker.example env.docker.example

      - name: Notas del release
        run: |
          cat > release-notes.md <<'EOF'
          ## Instalación rápida

          ### Docker (recomendado)

          1. Descarga `docker-compose.release.yml` y `env.docker.example`.
          2. `cp env.docker.example .env` y ajusta la IP del servidor y las claves.
          3. `docker compose -f docker-compose.release.yml up -d`

          La imagen está en `ghcr.io/gitcorion/tod:__VERSION__`. Si el paquete
          aparece privado la primera vez, cambia su visibilidad a pública en
          GitHub → Packages.

          ### Python 3.11+

          ```bash
          pip install https://github.com/GitCorion/TOD/releases/download/__TAG__/tod-__VERSION__-py3-none-any.whl
          tod service --host 0.0.0.0 --port 8773
          ```

          ### Desde el código

          ```bash
          git clone --branch __TAG__ https://github.com/GitCorion/TOD.git
          cd TOD
          cp .env.docker.example .env
          docker compose up -d --build
          ```

          Lee el [README](https://github.com/GitCorion/TOD#readme) para la
          primera puesta en marcha.
          EOF
          sed -i "s/__TAG__/${TAG}/g; s/__VERSION__/${VERSION}/g" release-notes.md

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "TOD ${VERSION}" \
              --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* docker-compose.release.yml \
            env.docker.example --clobber
