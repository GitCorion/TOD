[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tod"
version = "0.2.0"
description = "TOD — Torrent on Demand: catálogo, reproducción y administración unificados"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TOD contributors" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["torrent", "qbittorrent", "prowlarr", "jackett", "jellyfin", "streaming"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/GitCorion/TOD"
Repository = "https://github.com/GitCorion/TOD"
Issues = "https://github.com/GitCorion/TOD/issues"

[project.scripts]
tod = "catalogo.cli:main"
catalogo = "catalogo.cli:main"

[tool.setuptools.packages.find]
include = ["catalogo*"]

[tool.setuptools.package-data]
catalogo = [
  "web_static/*",
  "web_static/js/*",
  "web_static/js/views/*",
  "web_static/fonts/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
